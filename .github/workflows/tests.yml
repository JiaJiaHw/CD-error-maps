name: Synthetic tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            numpy: "1.26.4"
            pillow: "10.4.0"
          - python: "3.12"
            numpy: "2.2.6"
            pillow: "11.3.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated dependencies
        run: python -m pip install "numpy==${{ matrix.numpy }}" "Pillow==${{ matrix.pillow }}"
      - name: Run hand-calculated unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Build independent synthetic workspace
        run: python examples/make_synthetic_example.py
      - name: Validate template and explicit mapping
        run: |
          python run.py validate --config examples/synthetic_workspace/config.json
          python run.py validate --config examples/synthetic_workspace/config.explicit.json
      - name: Generate and verify synthetic batch
        run: |
          python run.py generate --config examples/synthetic_workspace/config.json --out examples/synthetic_workspace/outputs/ci
          python run.py verify --run examples/synthetic_workspace/outputs/ci
